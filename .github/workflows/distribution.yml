name: Test and publish container

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Go, client and OpenAPI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Check Go formatting
        run: test -z "$(gofmt -l ./*.go)"
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:openapi
      - name: Validate Compose configurations
        env:
          IMGSERVER_IMAGE: ghcr.io/example/imgserver:ci
          IMGSERVER_SIGNING_KEY: ci-placeholder-key-not-a-real-secret
        run: |
          docker compose config --quiet
          docker compose -f compose.release.yaml config --quiet

  container:
    name: Build and smoke-test image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: imgserver:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=imgserver-smoke
          cache-to: type=gha,mode=max,scope=imgserver-smoke
          provenance: false
      - name: Test container, healthcheck and volume persistence
        run: node container-smoke.mjs imgserver:ci

  publish:
    name: Publish AMD64 and ARM64 to GHCR
    needs: [test, container]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Use a tag such as v1.2.3 or v1.2.3-rc.1.' >&2
            exit 1
          fi
      - name: Set lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Sign in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - name: Build and publish
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=imgserver-release
          cache-to: type=gha,mode=max,scope=imgserver-release
          provenance: mode=max
          sbom: true
      - name: Verify published image and report package visibility
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          PACKAGE_OWNER_TYPE: ${{ github.event.repository.owner.type }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}@${IMAGE_DIGEST}"
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          image = os.environ['IMAGE_NAME']
          owner, package = image.removeprefix('ghcr.io/').split('/', 1)
          scope = 'orgs' if os.environ['PACKAGE_OWNER_TYPE'] == 'Organization' else 'users'
          url = f'https://api.github.com/{scope}/{owner}/packages/container/{urllib.parse.quote(package, safe="")}'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              details = json.load(response)
          visibility = details['visibility']
          print('GHCR package visibility:', visibility)
          print('Published image:', image + '@' + os.environ['IMAGE_DIGEST'])
          if visibility != 'public':
              print('::warning::For anonymous pulls, open the package settings and change visibility to public. GitHub does not expose this setting through its supported package API.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Published `{image}@{os.environ["IMAGE_DIGEST"]}`\n\n')
              summary.write(f'Package visibility: **{visibility}**. [Package settings]({details["html_url"]}/settings)\n')
          PY
