name: Audit or purge registry revisions

on:
  workflow_dispatch:
    inputs:
      affected_revisions:
        description: Exact old Git commit SHAs separated by spaces
        required: true
        type: string
      audited_manifest_digests:
        description: Previously audited manifest digests, only for resuming a partial purge
        required: false
        default: ""
        type: string
      mode:
        description: Audit first; PURGE permanently removes matching image versions
        required: true
        default: AUDIT
        type: choice
        options: [AUDIT, PURGE]

permissions:
  contents: read
  packages: write

concurrency:
  group: registry-revision-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match image manifests against explicitly selected source revisions
        env:
          AFFECTED_REVISIONS: ${{ inputs.affected_revisions }}
          AUDITED_MANIFEST_DIGESTS: ${{ inputs.audited_manifest_digests }}
          CLEANUP_MODE: ${{ inputs.mode }}
          PACKAGE_OWNER_TYPE: ${{ github.event.repository.owner.type }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 registry-cleanup.py
